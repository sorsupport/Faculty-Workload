# Copy to /etc/nginx/sites-available/fwl on the EC2 instance, then:
#   sudo ln -s /etc/nginx/sites-available/fwl /etc/nginx/sites-enabled/fwl
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust `root` below if the app isn't cloned at /var/www/fwl.

server {
    listen 80;
    server_name _;

    root /var/www/fwl/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
